name: tjbackend

on:
  push:
    branches: [main]
    paths:
      - "tjbackend/**"
      - ".github/workflows/tjbackend.yml"
  pull_request:
    paths:
      - "tjbackend/**"
      - ".github/workflows/tjbackend.yml"

defaults:
  run:
    working-directory: tjbackend

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: truejobs
          POSTGRES_PASSWORD: truejobs
          POSTGRES_DB: truejobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truejobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://truejobs:truejobs@localhost:5432/truejobs_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tjbackend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: tjbackend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check openapi.json is up to date
        run: |
          pnpm openapi:export
          git diff --exit-code openapi.json || { echo "::error::openapi.json is stale — run pnpm openapi:export"; exit 1; }
