name: tjnext

on:
  push:
    branches: [main]
    paths:
      - "tjnext/**"
      - ".github/workflows/tjnext.yml"
  pull_request:
    paths:
      - "tjnext/**"
      - ".github/workflows/tjnext.yml"

concurrency:
  group: tjnext-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tjnext

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: tjnext/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
