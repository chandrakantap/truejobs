# Local infrastructure only. Apps run natively (pnpm/uv); see AGENTS.md.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: truejobs
      POSTGRES_PASSWORD: truejobs # dev only; never reuse outside local development
      POSTGRES_DB: truejobs
    volumes:
      - tj_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truejobs -d truejobs"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  tj_pgdata:
